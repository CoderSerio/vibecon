name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-release:
    name: Build macOS release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "VibeCon ${{ github.ref_name }}"
          releaseBody: |
            VibeCon 0.0.8 turns Joy-Con sticks and fused rotation into a practical macOS pointer-control preview.

            Highlights:
            - Switch between stick and motion pointer modes by holding Joy-Con (L) minus or Joy-Con (R) plus.
            - Motion control uses display-normalized sweep presets, smooth speed-adaptive gain, and a real recentered pose origin.
            - SL/SR adjusts motion precision with a brief HUD and gentle vibration; the selected range persists locally.
            - L/R, ZL/ZR, and motion clutch combinations provide clicking, dragging, and repositioning with one hand.
            - Stick press gestures now distinguish click, drag, and ZL/ZR scrolling without leaking Ctrl+wheel zoom events.
            - Newly connected Joy-Cons are discovered and streamed automatically every five seconds.
            - Input logs keep enabled mappings active by default, with an explicit Pause mappings switch for focused debugging.
            - The signed development bundle keeps its stable Accessibility identity across ordinary Rust rebuilds.

            This is an experimental, ad-hoc-signed Apple Silicon macOS preview. See the README for Accessibility and Gatekeeper setup.
          releaseDraft: false
          prerelease: true
          args: --bundles dmg
