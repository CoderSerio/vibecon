name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-release:
    name: Build macOS release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "VibeCon ${{ github.ref_name }}"
          releaseBody: "Experimental macOS Joy-Con mapping presets, Keyboard Focus navigation, raw IMU inspection, and manual Joy-Con vibration testing. See README for Accessibility and Gatekeeper setup."
          releaseDraft: false
          prerelease: true
          args: --bundles dmg
