name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-release:
    name: Build macOS release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "VibeCon ${{ github.ref_name }}"
          releaseBody: |
            VibeCon 0.0.6 adds real-time fused Joy-Con orientation tracking to the interactive 3D debugger.

            Highlights:
            - Fusion AHRS consumes every native Joy-Con IMU sub-sample instead of dropping motion between UI frames.
            - Left and right Joy-Cons share one verified portrait coordinate system.
            - Recentered 3D rotation follows the physical controller without translating the model.
            - Live gyro, bias, timing, and accelerometer diagnostics help inspect tracking quality.
            - Release builds include a license-safe procedural Joy-Con; detailed third-party reference GLBs remain local-only.
            - Existing opt-in Codex/window mappings and manual vibration testing remain available.

            This is an experimental, ad-hoc-signed Apple Silicon macOS preview. See the README for Accessibility and Gatekeeper setup.
          releaseDraft: false
          prerelease: true
          args: --bundles dmg
